<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrasaTek Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <div class="md:hidden fixed top-0 w-full bg-blue-900 text-white p-4 flex justify-between items-center z-50 shadow-md">
        <h1 class="text-xl font-bold">ıllıllı PRASA ıllıllı</h1>
        <button id="mobile-menu-btn" class="text-white focus:outline-none">
            <i class="fas fa-bars text-2xl"></i>
        </button>
    </div>

    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 w-72 bg-white shadow-xl flex flex-col h-full z-40 transition-transform duration-300 ease-in-out mt-16 md:mt-0">
        <div class="hidden md:block p-6 bg-blue-900 text-white">
            <h1 class="text-2xl font-bold tracking-tight">ıllıllı PRASA ıllıllı</h1>
            <p class="text-sm text-blue-200 mt-1">Rack Item Manager</p>
        </div>
        
        <div class="p-4 border-b">
            <h2 class="text-lg font-semibold mb-3"><i class="fas fa-tags mr-2"></i>Categories</h2>
            <form id="add-category-form" class="flex gap-2">
                <input type="text" id="new-category-name" placeholder="New category..." required
                    class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700 transition"><i class="fas fa-plus"></i></button>
            </form>
        </div>

        <div class="flex-1 overflow-y-auto p-4 pb-20 md:pb-4">
            <ul id="category-list" class="space-y-2">
                </ul>
        </div>
    </aside>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-full bg-gray-50 mt-16 md:mt-0 w-full overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex flex-col sm:flex-row justify-between items-center gap-4 z-0">
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <h2 id="current-category-title" class="text-xl font-bold text-gray-700 hidden sm:block">All Items</h2>
                <div class="relative w-full sm:w-64">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="search-bar" placeholder="Search items..." 
                        class="pl-10 pr-4 py-2 border rounded-full w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-end">
                <button id="export-btn" class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700 transition shadow-sm text-sm flex items-center gap-2">
                    <i class="fas fa-file-excel"></i> Export
                </button>
                <label class="bg-yellow-500 text-white px-3 py-2 rounded hover:bg-yellow-600 transition shadow-sm cursor-pointer text-sm flex items-center gap-2">
                    <i class="fas fa-upload"></i> Import
                    <input type="file" id="import-file" accept=".xlsx, .xls, .csv" class="hidden">
                </label>
                <button id="open-add-modal-btn" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700 transition shadow-sm text-sm flex items-center gap-2">
                    <i class="fas fa-plus"></i> Add Item
                </button>
            </div>
        </header>

        <div class="flex-1 p-4 overflow-auto">
            <div class="bg-white rounded-lg shadow min-w-full">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden sm:table-cell">Category</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden md:table-cell">Pack Size</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="item-table-body" class="bg-white divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="add-item-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 m-4 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Add New Item</h3>
                <button id="close-modal-btn" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="add-item-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Item Code</label>
                    <input type="text" id="item-code" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Item Name</label>
                    <input type="text" id="item-name" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <select id="item-category" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500">
                        </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Pack Size</label>
                    <input type="text" id="item-pack-size" required class="mt-1 w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Save Item</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdm-R6d3nntIpXp3SnPs940WUkGC4vMAk",
            authDomain: "inventory-20678.firebaseapp.com",
            databaseURL: "https://inventory-20678-default-rtdb.firebaseio.com",
            projectId: "inventory-20678",
            storageBucket: "inventory-20678.firebasestorage.app",
            messagingSenderId: "350200719311",
            appId: "1:350200719311:web:d4838e9c44f65219a9d4ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Management
        let currentFilter = 'All';
        let allItems = [];
        let categories = [];

        // UI Helpers
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            toast.className = `${color} text-white px-4 py-2 rounded shadow-lg transition-opacity duration-300 opacity-0 flex items-center gap-2`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Mobile Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const toggleSidebar = () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };
        document.getElementById('mobile-menu-btn').addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Modal Logic
        const modal = document.getElementById('add-item-modal');
        document.getElementById('open-add-modal-btn').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));

        // --- Category Logic ---
        const categoryForm = document.getElementById('add-category-form');
        const categoryInput = document.getElementById('new-category-name');
        const categoryList = document.getElementById('category-list');
        const categorySelect = document.getElementById('item-category');

        categoryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const catName = categoryInput.value.trim();
            if (catName) {
                push(ref(db, 'categories'), { name: catName })
                    .then(() => {
                        categoryInput.value = '';
                        showToast('Category added!');
                    })
                    .catch(err => showToast(err.message, 'error'));
            }
        });

        onValue(ref(db, 'categories'), (snapshot) => {
            categories = [];
            categoryList.innerHTML = `
                <li class="cursor-pointer p-2 rounded hover:bg-gray-100 ${currentFilter === 'All' ? 'bg-blue-50 text-blue-700 font-bold' : ''}" 
                    onclick="window.setFilter('All')">
                    <i class="fas fa-boxes mr-2"></i>All Items
                </li>
            `;
            categorySelect.innerHTML = '<option value="" disabled selected>Select a category</option>';
            
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([id, cat]) => {
                    categories.push(cat.name);
                    categoryList.innerHTML += `
                        <li class="group flex justify-between items-center p-2 rounded hover:bg-gray-100 cursor-pointer ${currentFilter === cat.name ? 'bg-blue-50 text-blue-700 font-bold' : ''}">
                            <span onclick="window.setFilter('${cat.name}')" class="flex-1 truncate">${cat.name}</span>
                            <button onclick="window.deleteCategory('${id}')" class="text-red-500 opacity-0 group-hover:opacity-100 transition px-2 md:hidden group-hover:block"><i class="fas fa-trash-alt"></i></button>
                        </li>
                    `;
                    categorySelect.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
                });
            }
        });

        window.setFilter = (catName) => {
            currentFilter = catName;
            const titleEl = document.getElementById('current-category-title');
            if(titleEl) titleEl.innerText = catName === 'All' ? 'All Items' : catName;
            renderItems();
            onValue(ref(db, 'categories'), () => {}, { onlyOnce: true }); 
            if(window.innerWidth < 768) toggleSidebar(); // Close sidebar on mobile after selection
        };

        window.deleteCategory = (id) => {
            if(confirm('Delete this category? Items within it will remain but may lose categorization.')) {
                remove(ref(db, `categories/${id}`)).then(() => showToast('Category deleted')).catch(err => showToast(err.message, 'error'));
            }
        };

        // --- Item Logic ---
        const tableBody = document.getElementById('item-table-body');
        const itemForm = document.getElementById('add-item-form');

        // Add Item with Duplicate Check
        itemForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                itemCode: document.getElementById('item-code').value.trim(),
                itemName: document.getElementById('item-name').value.trim(),
                category: document.getElementById('item-category').value,
                packSize: document.getElementById('item-pack-size').value.trim()
            };

            // Check for duplicates locally first
            const isDuplicate = allItems.some(item => item.itemCode.toLowerCase() === newItem.itemCode.toLowerCase());
            
            if (isDuplicate) {
                showToast(`Item Code ${newItem.itemCode} already exists!`, 'error');
                return;
            }

            push(ref(db, 'items'), newItem)
                .then(() => {
                    itemForm.reset();
                    modal.classList.add('hidden');
                    showToast('Item added successfully!');
                })
                .catch(err => showToast(err.message, 'error'));
        });

        onValue(ref(db, 'items'), (snapshot) => {
            allItems = [];
            const data = snapshot.val();
            if (data) {
                allItems = Object.entries(data).map(([id, item]) => ({ id, ...item }));
                allItems.sort((a, b) => a.itemName.localeCompare(b.itemName));
            }
            renderItems();
        });

        function renderItems() {
            tableBody.innerHTML = '';
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();
            
            const filteredItems = allItems.filter(item => {
                const matchesCategory = currentFilter === 'All' || item.category === currentFilter;
                const matchesSearch = item.itemName.toLowerCase().includes(searchTerm) || item.itemCode.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if(filteredItems.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">No items found.</td></tr>`;
                return;
            }

            filteredItems.forEach(item => {
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-4 py-3 whitespace-nowrap font-mono text-sm text-gray-900">${item.itemCode}</td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-900 max-w-[150px] truncate" title="${item.itemName}">${item.itemName}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 hidden sm:table-cell">
                            <span class="px-2 py-1 inline-flex text-xs leading-4 font-semibold rounded-full bg-blue-100 text-blue-800">
                                ${item.category}
                            </span>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 hidden md:table-cell">${item.packSize}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="window.deleteItem('${item.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('search-bar').addEventListener('input', renderItems);

        window.deleteItem = (id) => {
            if(confirm('Are you sure you want to delete this item?')) {
                remove(ref(db, `items/${id}`)).then(() => showToast('Item deleted')).catch(err => showToast(err.message, 'error'));
            }
        };

        // --- Excel Import/Export ---
        document.getElementById('export-btn').addEventListener('click', () => {
            if(allItems.length === 0) return showToast('No data to export', 'error');
            // Clean data for export (remove Firebase ID)
            const exportData = allItems.map(({id, ...rest}) => rest);
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Inventory");
            XLSX.writeFile(workbook, "PrasaTek_Inventory.xlsx");
            showToast('Export complete!');
        });

        document.getElementById('import-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                
                let addedCount = 0;
                let duplicateCount = 0;

                jsonData.forEach(row => {
                    // Standardize keys from excel (assuming columns might be named ItemCode, etc)
                    const normalizedRow = {
                        itemCode: String(row.ItemCode || row.itemCode || row.Code || '').trim(),
                        itemName: String(row.ItemName || row.itemName || row.Name || '').trim(),
                        category: String(row.Category || row.category || 'Uncategorized').trim(),
                        packSize: String(row.PackSize || row.packSize || row.Size || '').trim()
                    };

                    if (!normalizedRow.itemCode) return; // Skip invalid rows

                    const isDuplicate = allItems.some(item => item.itemCode.toLowerCase() === normalizedRow.itemCode.toLowerCase());
                    
                    if (!isDuplicate) {
                        push(ref(db, 'items'), normalizedRow);
                        addedCount++;
                    } else {
                        duplicateCount++;
                    }
                });
                
                showToast(`Imported: ${addedCount} added. ${duplicateCount} duplicates skipped.`);
                e.target.value = ''; // Reset file input
            };
            reader.readAsArrayBuffer(file);
        });

    </script>
</body>
</html>
